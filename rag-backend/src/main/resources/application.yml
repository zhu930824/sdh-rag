server:
  address: 0.0.0.0
  port: 8989

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}


spring:
  application:
    name: rag-backend
  web:
    resources:
      add-mappings: false
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:${DASHSCOPE_API_KEY:}}
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: sdh-rag-index
        dimensions: 1536
        similarity: cosine
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}
  datasource:
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sdh_rag}?serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms         # 连接超时时间
      lettuce:
        pool:
          max-active: 8       # 最大连接数
          max-idle: 4         # 最大空闲连接数
          min-idle: 1         # 最小空闲连接数
          max-wait: 2000ms



xushu:
  agent:
    runtime: ${AGENT_RUNTIME:legacy}
  jwt:
    admin-secret-key: ${JWT_ADMIN_SECRET:}
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: ${JWT_USER_SECRET:}
    user-ttl: 7200000
    user-token-name: token

# MinIO 配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket-name: ${MINIO_BUCKET_NAME:sdh-documents}



logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [trace=%X{traceId:-}] %logger{36} - %msg%n"
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: info

security:
  startup-validation:
    enabled: ${SECURITY_STARTUP_VALIDATION_ENABLED:true}
  webhook:
    allow-http: ${WEBHOOK_ALLOW_HTTP:false}
    allow-private-network: ${WEBHOOK_ALLOW_PRIVATE_NETWORK:false}

# 数据库持久化可靠任务
jobs:
  dispatch-delay-ms: ${JOB_DISPATCH_DELAY_MS:2000}
  dispatch-batch-size: ${JOB_DISPATCH_BATCH_SIZE:10}
  lease-seconds: ${JOB_LEASE_SECONDS:600}

outbox:
  relay:
    interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
    lease-seconds: ${OUTBOX_RELAY_LEASE_SECONDS:60}

operations:
  metrics:
    refresh-ms: ${OPERATIONS_METRICS_REFRESH_MS:15000}
  alerts:
    job-backlog: ${ALERT_JOB_BACKLOG:100}
    oldest-job-seconds: ${ALERT_OLDEST_JOB_SECONDS:300}
    outbox-backlog: ${ALERT_OUTBOX_BACKLOG:20}
    dead-letters-24h: ${ALERT_DEAD_LETTERS_24H:1}

knowledge:
  documents:
    index-lock-minutes: ${KNOWLEDGE_DOCUMENT_INDEX_LOCK_MINUTES:120}
    recovery-delay-ms: ${KNOWLEDGE_DOCUMENT_RECOVERY_DELAY_MS:60000}
    recovery-initial-delay-ms: ${KNOWLEDGE_DOCUMENT_RECOVERY_INITIAL_DELAY_MS:30000}
  sources:
    scheduler-delay-ms: 60000
    scheduler-batch-size: 20
    lock-minutes: 20
  default:
    chunk-size: 500
    chunk-overlap: 50
    embeddingModel: text-embedding-v2
    rankModel: qwen3-rerank
  retrieval:
    hot-min-results: 3
    cold-score-penalty: 0.9
    hard-threshold: 0.6
    mmr-lambda: 0.7
    recency-alpha: 0.3
    coarse-top-k: 50
    fine-top-k: 20
    final-top-k: 5
    enable-cold-archive: true
    enable-summary-index: true
    fallback-strategy: keyword

# RAG Advisor 配置
rag:
  use-advisor: true  # true: 使用 Spring AI Advisor 机制; false: 使用原有手动 RAG 流程
  memory-window-size: 10  # 对话记忆窗口大小

# 记忆系统配置
memory:
  enabled: true
  working-window-size: 10
  working-memory-ttl-hours: 1
  semantic-similarity-threshold: 0.75
  semantic-dedup-threshold: 0.9
  pattern-min-observations: 3
  preference-importance-threshold: 5
  boundary-detection-window-size: 3
  summary-max-messages: 20
  decay-cron: "0 0 3 * * ?"
  memory-index-name: "sdh-memory-index"
  working-memory-key-prefix: "memory:working:"

# 智能路由配置
intent-router:
  enabled: true
  min-relevance-score: 0.3
  max-recommended-bases: 3
  show-router-info: true
  cache-enabled: true
  cache-ttl-minutes: 10
