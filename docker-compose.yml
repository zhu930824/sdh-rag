version: '3.8'

services:
  # 后端服务
  rag-backend:
    build:
      context: .
      dockerfile: rag-backend/Dockerfile
    container_name: sdh-rag-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ELASTICSEARCH_URI=${ELASTICSEARCH_URI:-http://host.docker.internal:9200}
      - NEO4J_URI=${NEO4J_URI:-bolt://host.docker.internal:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://host.docker.internal:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-sdh-documents}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - JWT_ADMIN_SECRET=${JWT_ADMIN_SECRET:?Set JWT_ADMIN_SECRET in .env}
      - JWT_USER_SECRET=${JWT_USER_SECRET:?Set JWT_USER_SECRET in .env}
      - JOB_DISPATCH_DELAY_MS=${JOB_DISPATCH_DELAY_MS:-2000}
      - JOB_DISPATCH_BATCH_SIZE=${JOB_DISPATCH_BATCH_SIZE:-10}
      - JOB_LEASE_SECONDS=${JOB_LEASE_SECONDS:-600}
    ports:
      - "${BACKEND_PORT:-8989}:8989"
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 前端服务
  rag-frontend:
    build:
      context: ./rag-frontend
      dockerfile: Dockerfile
    container_name: sdh-rag-frontend
    restart: unless-stopped
    depends_on:
      - rag-backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

# 数据卷定义
volumes:
  backend_logs:
    driver: local
  backend_uploads:
    driver: local
